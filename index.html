
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EVOTEQ Virtual Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      background: url('assets/background.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
    }

    .floating-logo {
      position: absolute;
      top: 40px;
      left: 40px;
      height: 60px;
      max-width: 90vw;
      object-fit: contain;
      z-index: 1000;
    }

    main {
      padding: 5vw;
      margin: 100px auto 60px;
      max-width: 900px;
      background-color: rgba(95, 15, 38, 0.85);
      color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(3px);
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-top: 0;
      font-weight: 600;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      background-color: rgba(28, 28, 27, 0.9);
      color: #e9eaea;
    }

    @media (max-width: 600px) {
      .floating-logo {
        height: 40px;
        top: 20px;
        left: 20px;
      }

      main {
        margin: 80px 20px 40px;
        padding: 20px;
      }

      h1 {
        font-size: 1.5em;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Logo -->
  <img src="assets/evoteq-logo.png" alt="EVOTEQ Logo" class="floating-logo" />

  <main>
    <h1>Welcome to Our Virtual Assistant Page</h1>
  </main>

  <footer>
    <p>&copy; 2025 EVOTEQ. All rights reserved.</p>
  </footer>

  <!-- Heygen Embed Script -->
  <script>
    !function(window){
      const host="https://labs.heygen.com";
      const url=host+"/guest/streaming-embed?share=eyJxdWFsaXR5IjoiaGlnaCIsImF2YXRhck5hbWUiOiJlNGE0ZDIzZGM3OWU0NzM1ODEyNWQzNTVjZWUxZjg0MiIsInByZXZpZXdJbWciOiJodHRwczovL2ZpbGVzMi5oZXlnZW4uYWkvYXZhdGFyL3YzL2U0YTRkMjNkYzc5ZTQ3MzU4MTI1ZDM1NWNlZTFmODQyL2Z1bGwvMi4yL3ByZXZpZXdfdGFyZ2V0LndlYnAiLCJuZWVkUmVtb3ZlQmFja2dyb3VuZCI6ZmFsc2UsImtub3dsZWRnZUJhc2VJZCI6ImUyZDE2NzY1NDg1NzQ0ZDg4ZDVhYTNjMDk0NTM4ZWM5IiwidXNlcm5hbWUiOiIwY2FhMzVmZWVjYzg0MGQ5YmVhMzI3ZTdkZTU1MzU4MSJ9&inIFrame=1";
      const clientWidth=document.body.clientWidth;
      const wrapDiv=document.createElement("div");
      wrapDiv.id="heygen-streaming-embed";
      const container=document.createElement("div");
      container.id="heygen-streaming-container";
      const stylesheet=document.createElement("style");
      const expandStyle = clientWidth < 540
        ? "height: 266px; width: 96%; left: 50%; transform: translateX(-50%);"
        : "height: 366px; width: calc(366px * 16 / 9);";

      stylesheet.innerHTML=`
        #heygen-streaming-embed {
          z-index: 9999;
          position: fixed;
          left: 40px;
          bottom: 40px;
          width: 200px;
          height: 200px;
          border-radius: 50%;
          border: 2px solid #fff;
          box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.12);
          transition: all linear 0.1s;
          overflow: hidden;
          opacity: 0;
          visibility: hidden;
        }
        #heygen-streaming-embed.show {
          opacity: 1;
          visibility: visible;
        }
        #heygen-streaming-embed.expand {
          ${expandStyle}
          border: 0;
          border-radius: 8px;
        }
        #heygen-streaming-container {
          width: 100%;
          height: 100%;
        }
        #heygen-streaming-container iframe {
          width: 100%;
          height: 100%;
          border: 0;
        }
      `;
      const iframe=document.createElement("iframe");
      iframe.allowFullscreen=!1;
      iframe.title="Streaming Embed";
      iframe.role="dialog";
      iframe.allow="microphone";
      iframe.src=url;
      let visible=!1,initial=!1;
      window.addEventListener("message",(e=>{
        e.origin===host&&e.data&&e.data.type==="streaming-embed"&&(
          e.data.action==="init" ? (initial=!0,wrapDiv.classList.toggle("show",initial)) :
          e.data.action==="show" ? (visible=!0,wrapDiv.classList.toggle("expand",visible)) :
          e.data.action==="hide" && (visible=!1,wrapDiv.classList.toggle("expand",visible))
        );
      }));
      container.appendChild(iframe);
      wrapDiv.appendChild(stylesheet);
      wrapDiv.appendChild(container);
      document.body.appendChild(wrapDiv);
    }(globalThis);
  </script>

</body>
</html>
