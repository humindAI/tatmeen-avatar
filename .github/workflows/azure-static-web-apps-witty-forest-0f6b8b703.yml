  
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main  # Trigger deployment on push to the `main` branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Build and Deploy
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}  # Correctly referencing the deployment token from GitHub secrets
        action: "upload"
        app_location: "/"  # This points to the location of your static files (index.html)
        output_location: "/"
        app_build_command: ""  # This will skip any build steps

        
